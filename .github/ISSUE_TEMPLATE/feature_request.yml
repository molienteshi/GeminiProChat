name: 🚀 功能建议
description: 提出新功能或改进建议
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        ### 提交前请确认
        感谢抽出时间填写功能建议！提交前请确认以下几点：

        ✅ 已在 GitHub Issues 或 Discussions 中搜索，确认该建议尚未被提出。
  - type: textarea
    id: feature-description
    attributes:
      label: 功能描述
      description: 请清晰、简洁地说明你希望增加的功能。
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 补充说明
      description: 其他背景信息或截图可写在这里。
  - type: checkboxes
    id: will-pr
    attributes:
      label: 参与贡献
      options:
        - label: 我愿意为此功能提交 Pull Request。
          required: false
