name: 🐞 自建部署问题反馈
description: 反馈部署到自有服务器或云平台时遇到的问题或疑似缺陷
labels: ['pending triage', 'deploy']
body:
  - type: markdown
    attributes:
      value: |
        ### 提交前请确认
        感谢抽出时间填写问题反馈！提交前请确认以下几点：

        ✅ 我使用的是 **最新版本的 GeminiProChat**。
        ✅ 已在 GitHub Issues 中搜索，确认该问题尚未被报告。
  - type: dropdown
    id: server
    attributes:
      label: Gemini Pro Chat 是如何部署的？
      description: 请选择使用的部署方式。
      options:
        - Node
        - Docker
        - Vercel
        - Netlify
        - Railway
        - 其他（请在描述中说明）
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: 问题描述
      description: 请清晰、简洁地说明遇到的问题。
      placeholder: 问题描述
    validations:
      required: true
  - type: textarea
    id: console-logs
    attributes:
      label: 控制台日志
      description: 请检查浏览器和 Node 控制台，如有错误信息请填写。
  - type: checkboxes
    id: will-pr
    attributes:
      label: 参与贡献
      options:
        - label: 我愿意为此问题提交 Pull Request。
          required: false
